name: Update AtCoder AlgoView Data

on:
  schedule:
    # 1日3回実行 (JST 08:00, 16:00, 24:00 = UTC 23:00, 07:00, 15:00)
    - cron: '0 7,15,23 * * *'
  workflow_dispatch:
    inputs:
      gemini_model:
        description: '使用するGeminiモデル名'
        required: false
        default: 'gemini-2.5-flash'

permissions:
  contents: write

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run AtCoder & Gemini analyzer
        env:
          ATCODER_USER: 'Pikapurin'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          python scripts/analyze_atcoder.py

      - name: Commit and push updated JSON data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analyzed_problems.json data/user_summary.json
          if git diff --cached --quiet; then
            echo "No changes in data/*.json. Skipping commit."
          else
            git commit -m "chore(data): update Pikapurin AtCoder analysis & recommendations [skip ci]"
            git push
          fi
